<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração Inicial</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">Configuração Inicial</h1>
    <p class="text-slate-500 text-sm text-center mb-6">Crie a conta de administrador para acessar o sistema.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="mb-3 p-3 rounded-lg text-sm {{ 'bg-red-100 text-red-800' if cat == 'danger' else 'bg-green-100 text-green-800' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1" for="username">Username</label>
        <input id="username" name="username" type="text" required autocomplete="username"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1" for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Senha (mín. 8 caracteres)</label>
        <input id="password" name="password" type="password" required autocomplete="new-password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1" for="confirmar">Confirmar senha</label>
        <input id="confirmar" name="confirmar" type="password" required autocomplete="new-password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
        Criar Administrador
      </button>
    </form>
  </div>
</body>
</html>
