<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Ponto Digital{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="bg-blue-900 min-h-screen text-white select-none">
  <div class="capture-flash" id="captureFlash"></div>
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/totem.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
